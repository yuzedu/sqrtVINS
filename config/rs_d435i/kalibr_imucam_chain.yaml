%YAML:1.0

# Intel RealSense D435I - Infrared 1 monocular configuration
# Intrinsics from factory calibration (rs-enumerate-devices) at 848x480
# Extrinsics from "Gyro" to "Infrared 1" in rs-enumerate-devices.txt

cam0:
  # T_cam_imu: transforms points from IMU (Gyro) frame to Infrared 1 camera frame
  # From rs-enumerate-devices: Extrinsic from "Gyro" To "Infrared 1"
  #   R = Identity, T = [0.00552, -0.00510, -0.01174]
  T_cam_imu:
    - [ 1.0,  0.0,  0.0,  0.00552000012248755]
    - [ 0.0,  1.0,  0.0, -0.00510000018402934]
    - [ 0.0,  0.0,  1.0, -0.011739999987185  ]
    - [ 0.0,  0.0,  0.0,  1.0                ]
  cam_overlaps: []
  camera_model: pinhole
  # Factory calibration has zero distortion for the stereo IR module;
  # set calib_cam_intrinsics: true in estimator_config to refine online.
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  # fu, fv, cu, cv  (Infrared 1 / 848x480 from rs-enumerate-devices)
  intrinsics: [425.566833496094, 425.566833496094, 423.784881591797, 244.608352661133]
  resolution: [848, 480]
  rostopic: /camera/infra1/image_raw
  timeshift_cam_imu: 0.0
